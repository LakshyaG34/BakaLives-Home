services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bakalives
      POSTGRES_USER: bakalives
      POSTGRES_PASSWORD: bakalives
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_create_inquiries.sql:/docker-entrypoint-initdb.d/001_create_inquiries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakalives -d bakalives"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://bakalives:bakalives@db:5432/bakalives
      CLIENT_ORIGINS: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
